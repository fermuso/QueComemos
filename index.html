<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6653c7">
  <meta name="description" content="Tu mesa, tu familia y una semana más fácil. Menús y compra privados en tu dispositivo.">
  <title>QuéComemos · Tu semana, a tu gusto</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="./" aria-label="QuéComemos, inicio"><img src="./assets/icon.svg" width="43" height="43" alt=""><span>qué<span class="brand-second">comemos</span><span class="brand-dot">.</span></span></a>
      <p class="sidebar-tagline">Menos vueltas.<br>Más sobremesa.</p>
      <nav id="navigation" class="navigation" aria-label="Secciones"></nav>
      <div class="sidebar-bottom"><div class="private-badge"><span class="private-icon" aria-hidden="true">⌂</span><div><strong>Se queda en casa</strong><span>Tus datos, en este navegador.</span></div></div><span class="version">Hecho para compartir mesa · v0.1.0</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><span class="topbar-crumb" id="breadcrumb">Nuestra semana</span><div class="topbar-actions"><span class="connection-status" id="connection-status"><span class="status-dot"></span>Sin conexión</span><button class="avatar" type="button" data-action="navigate" data-view="familia" aria-label="Ir a Mi familia">Mi</button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer"><span>Un poco de organización. Mucho por disfrutar.</span><button class="text-button" type="button" data-action="navigate" data-view="ajustes">Privacidad y copias de seguridad</button></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="busy-status" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input id="backup-file" class="sr-only" type="file" accept="application/json,.json" aria-label="Importar copia de seguridad">
  <input id="recipe-file" class="sr-only" type="file" accept="application/json,.json" aria-label="Importar recetas JSON">
  <input id="source-files" class="sr-only" type="file" multiple accept=".pdf,.txt,.md,.markdown,.json" aria-label="Importar documentos">
  <input id="source-folder" class="sr-only" type="file" multiple webkitdirectory directory aria-label="Seleccionar carpeta DATOS_RAG">
  <noscript><p class="noscript">QuéComemos necesita JavaScript para guardar datos y preparar tus menús en este dispositivo.</p></noscript>
  <script>if(location.protocol==='file:'){document.getElementById('main').innerHTML='<div class="notice warn"><p>Abre QuéComemos con el servidor localhost incluido o mediante HTTPS. Los módulos, IndexedDB y el modo offline requieren un servidor; consulta README.md.</p></div>';}</script>
</body>
</html>
